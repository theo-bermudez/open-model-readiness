# Single source of truth for WHAT we audit and WHERE each number comes from.
# Rerunning the audit on a new release = edit this file, then run the harness against it.
# Identifiers and labels only. Sizes, versions and flags belong to evidence/ and runs/.
# harness/models.py validates this file, so the rules below are enforced, not just documented.

audit:
  as_of: "2026-11-09"            # ecosystem state the audit is anchored to
  kind: retrospective            # NOT day-0: these models shipped between March and October 2026
  probe_repeats: 3               # every probe runs 3x per (model, engine, hardware) to expose variance
  judge_calibration_labels: 20   # hand-labelled by Theo only; never generated by Claude
  judge_budget_usd: 0            # current authorization: no paid judging; historical ceiling was $5

# Engine-vs-engine tables may only compare columns with the SAME hardware class.
hardware:
  laptop: "MacBook Pro, Apple M2, 8 GB unified memory (Metal)"
  t4: "Kaggle notebook, one NVIDIA T4 16 GB (CUDA_VISIBLE_DEVICES=0)"
  hosted: "NVIDIA-hosted endpoint: hardware and engine not disclosed"

models:
  nemotron-3.5-super-vl:
    role: A
    display: "NVIDIA Nemotron 3.5 Super VL 120B-A12B"
    label: "NVIDIA-hosted, text-only"       # printed next to every number from this model
    hf_repo: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
    columns:
      - engine: nvidia-api
        hardware: hosted
        served_by: nvidia-hosted
        base_url: "https://integrate.api.nvidia.com/v1"
        model_id: nvidia/nemotron-3.5-super-vl-120b-a12b
        api_key_env: NVIDIA_API_KEY         # the NAME of the variable; the value lives only in .env

  nemotron-3-nano-4b:
    role: B
    display: "NVIDIA Nemotron-3-Nano-4B"
    label: "self-served"
    hf_repo: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    tokenizer_repo: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16   # AIPerf needs a tokenizer to count tokens
    columns:
      - engine: ollama
        hardware: laptop
        served_by: self
        label: "Homebrew Ollama 0.40.15"   # formula sets flash attention on + q8_0 KV cache
        thinking_modes: ["on (default, primary)", "off via reasoning_effort:none (secondary)"]
        model_id: "nemotron-3-nano:4b-q4_K_M"
        quantization: Q4_K_M
      - engine: ollama
        hardware: t4
        served_by: self
        model_id: "nemotron-3-nano:4b-q4_K_M"
        quantization: Q4_K_M                # open question for M10: also q8_0, which is closer to vLLM/SGLang FP16?
      - engine: vllm
        hardware: t4
        served_by: self
        model_id: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
        quantization: "BF16 weights; served as FP16 if the T4 requires it (confirm in M10)"
      - engine: sglang
        hardware: t4
        served_by: self
        model_id: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
        quantization: "BF16 weights; served as FP16 if the T4 requires it (confirm in M10)"

  dory-1.0-4b:
    role: M14                    # second model, used to test RUNBOOK.md; not part of the A/B comparison
    display: "NVIDIA Nemotron Labs Dory 1.0 4B"
    label: "self-served"
    hf_repo: nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16
    columns: []                  # chosen in M14 from what actually loads (see evidence/ for the M1 snapshot)
