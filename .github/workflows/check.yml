name: Check published artifact
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git config core.hooksPath scripts/githooks
      - run: python -m unittest discover -s tests -t .
      - run: python scripts/build_public.py --check
      - run: python scripts/check_site.py
